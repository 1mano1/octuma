[project]
# Todo se llama igual: lo que se instala, lo que se importa y el comando.
# Antes no era asi: el proyecto se llamaba TinyQ y hubo que distribuirlo como
# "tiny-q" porque "tinyq" estaba tomado en PyPI por un gestor de colas sin
# relacion. "octuma" estaba libre el 2026-09-22 (PyPI responde 404), asi que
# esa costura desaparecio.
# Libre no es reservado: nadie lo tiene hasta que se suba.
name = "octuma"
# La version vive SOLO en src/octuma/__init__.py. Estaba escrita tambien aqui,
# y nada obligaba a que coincidieran: se podia publicar un paquete que dijera
# una version y un `octuma --version` que dijera otra.
dynamic = ["version"]
description = "Cuantizacion INT4/INT8 de modelos de lenguaje para equipos modestos y telefonos Android"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Imanol Rodriguez" }]
keywords = ["cuantizacion", "quantization", "int4", "gptq", "awq", "gguf", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.2",
    "safetensors>=0.4",
    "numpy>=1.24",
    "typer>=0.12",
    "rich>=13.7",
    "psutil>=5.9",  # para avisar de la memoria antes de empezar
]

[project.optional-dependencies]
hf = ["transformers>=4.44", "datasets>=2.20", "sentencepiece", "accelerate"]
gguf = ["gguf>=0.10"]
dev = ["pytest>=8", "pytest-cov", "ruff>=0.6"]

[project.urls]
# Estas URLs son la barra lateral de la pagina de PyPI: si el repo se renombra,
# se cambian aqui tambien o la unica via de entrada al proyecto queda rota.
Homepage = "https://github.com/1mano1/octuma"
Repository = "https://github.com/1mano1/octuma"
Issues = "https://github.com/1mano1/octuma/issues"

[project.scripts]
octuma = "octuma.cli:app"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "octuma.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["out", "runs", ".venv"]

[tool.ruff.lint]
select = [
    "E", "W",   # estilo (pycodestyle)
    "F",        # errores reales: variables sin usar, imports rotos
    "I",        # orden de los imports
    "UP",       # sintaxis moderna de Python
    "B",        # trampas comunes: mutables por defecto y companía
]
# el largo de linea lo arregla el formateador; avisar dos veces estorba
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# los scripts son andamiaje suelto: se les permiten imports despues del codigo
"scripts/*" = ["E402", "B023"]
# typer declara las opciones como typer.Option(...) en los valores por defecto:
# es su forma normal de trabajar, no la trampa que B008 quiere evitar
"src/octuma/cli.py" = ["B008"]
# los hooks capturan la variable del bucle con _name=name, que es el patron
# correcto; B023 no lo reconoce y marca falsos positivos
"src/octuma/quantizer.py" = ["B023"]
"src/octuma/sensitivity.py" = ["B023"]
