name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependencias (torch CPU)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[hf,gguf,dev]"

      # Las pruebas usan modelos Llama diminutos creados al vuelo: no se
      # descarga nada de Hugging Face y corren en segundos.
      - name: Pruebas
        run: pytest -q
