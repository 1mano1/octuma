name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  estilo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install ruff
      - run: ruff check src tests scripts
      - run: ruff format --check src tests scripts

  pytest:
    # TinyQ existe para equipos modestos, asi que Windows no es opcional: es
    # donde aparecen los problemas de rutas y de codificacion de texto.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Instalar dependencias (torch CPU)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[hf,gguf,dev]"

      # Las pruebas usan modelos Llama diminutos creados al vuelo: no se
      # descarga nada de Hugging Face y corren en segundos.
      - name: Pruebas
        run: pytest -q
